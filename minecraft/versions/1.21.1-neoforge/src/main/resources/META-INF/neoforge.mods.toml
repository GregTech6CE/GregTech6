modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.243,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

# KubeJS is optional. AFTER makes its constructor, which loads startup scripts, finish before this mod's registry events.
[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="[2101.7.2,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="gregtech-neoforge.mixins.json"
