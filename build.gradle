plugins { id 'base' }

version = mod_version
group = mod_group_id

// Incremental resource moves can leave empty old directories in build outputs.
// Only files define mod content; never retain those directories in a delivered jar.
subprojects {
    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach { includeEmptyDirs = false }
}

apply from: 'gradle/stonecutter-native.gradle'

tasks.register('sourcePolicyCheck', Exec) {
    dependsOn 'prepareNativeTools'
    description = 'Checks source boundaries and bilingual language contracts without starting a game.'
    group = 'verification'
    workingDir rootDir
    commandLine (findProperty('pythonExecutable') ?: 'python'), '-X', 'utf8',
            'tools/integration/check_source.py', '--output', 'build/reports/source-policy.json'
}

tasks.register('addonApiDocsCheck', Exec) {
    description = 'Checks SDK documentation references, bilingual structure, anchors and limit sources.'
    group = 'verification'
    workingDir rootDir
    commandLine (findProperty('pythonExecutable') ?: 'python'), '-X', 'utf8',
            'tools/check_addon_api_docs.py'
}

tasks.register('addonApiDocsTest', Exec) {
    description = 'Runs regression tests for the SDK documentation checker.'
    group = 'verification'
    workingDir rootDir
    commandLine (findProperty('pythonExecutable') ?: 'python'), '-X', 'utf8',
            '-m', 'unittest', 'discover', '-s', 'tools/tests', '-p', 'test_addon_api_docs.py'
}
tasks.named('check').configure {
    dependsOn ':core:check', ':multiversion:1.20.1-forge:check', ':multiversion:1.21.1-neoforge:check'
}
tasks.named('assemble').configure { dependsOn 'assembleBothPlatforms' }
tasks.named('clean').configure {
    dependsOn ':core:clean', ':multiversion:1.20.1-forge:clean', ':multiversion:1.21.1-neoforge:clean'
}
