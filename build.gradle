plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'net.neoforged.moddev' version '2.0.142' apply false
}

version = mod_version
group = mod_group_id

// Incremental resource moves can leave empty old directories in build outputs.
// Only files define mod content; never retain those directories in a delivered jar.
// All projects, not only subprojects: the Stonecutter version nodes and the API platform
// nodes build jars of their own and carry the same directory entries.
allprojects {
    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach { includeEmptyDirs = false }
}

// Formatting lives in the build, not in individual edits. The inlined API sources keep
// their own formatting pass; committed generated sources stay untouched in this pass.
// Local checks only look at files changed since the default branch; CI keeps the full check.
// Set -PspotlessRatchet=<ref> to override, or -PspotlessRatchet= to disable the ratchet.
def spotlessRatchet = null
if (System.getenv('CI') == null) {
    try {
        def probe = providers.exec {
            commandLine 'git', 'rev-parse', '--verify', '--quiet', 'origin/master'
            ignoreExitValue = true
        }
        if (probe.result.get().exitValue == 0) spotlessRatchet = 'origin/master'
    } catch (Exception ignored) {
        // No git or no default branch: keep the full check.
    }
}
def requestedRatchet = providers.gradleProperty('spotlessRatchet').orNull
if (requestedRatchet != null) spotlessRatchet = requestedRatchet ?: null
def spotlessProjects = [':core', ':buildtools', ':minecraft', ':minecraft:1.20.1-forge', ':minecraft:1.21.1-neoforge']
configure(spotlessProjects.collect { project(it) }) { spotlessProject ->
    // Spotless resolves the formatter and its transitive dependencies from this project's
    // repositories. Core and the shared Minecraft project have no repository of their own;
    // the loader nodes already add their own, so leave their resolution untouched.
    if (spotlessProject.path == ':core' || spotlessProject.path == ':minecraft') {
        spotlessProject.repositories {
            mavenCentral()
        }
    }
    spotlessProject.apply plugin: 'com.diffplug.spotless'
    // Root the trees at the Java source directories. Scanning src/**/*.java walks every
    // resource file first, and core carries tens of thousands of them: several seconds per
    // resolution, repeated for every up-to-date check.
    def srcDir = spotlessProject.file('src')
    def javaRoots = (srcDir.isDirectory() ? srcDir.listFiles() : new File[0])
            .findAll { new File(it, 'java').isDirectory() }
            .collect { new File(it, 'java') }
    def javaSources = spotlessProject.files(javaRoots.collect { File root ->
        spotlessProject.fileTree(root) {
            include '**/*.java'
            exclude '**/generated/**'
        }
    })
    // Stonecutter keeps one version's code inside block comments. A formatter cannot
    // see through those comments, so marked files wait for the per-node pass. Ask git for
    // the marked files instead of reading every source: the scan runs on each check and a
    // full content read costs seconds on Windows. Untracked files are not in the index, so
    // only those are read directly. Resolve lazily; ordinary invocations never scan.
    def stonecutterPaths = spotlessProject.provider {
        def root = spotlessProject.projectDir
        def marked = new LinkedHashSet<String>()
        def scanContents = {
            javaSources.filter { File file -> file.getText('UTF-8').contains('//?') }
                    .files.each { File file -> marked << spotlessProject.relativePath(file) }
            marked
        }
        try {
            def grep = spotlessProject.providers.exec {
                workingDir root
                commandLine 'git', 'grep', '-l', '-F', '--', '//?', ':(glob)src/**/*.java'
                ignoreExitValue = true
            }
            // git grep: 0 found matches, 1 found none, anything else means git failed.
            if (grep.result.get().exitValue > 1) return scanContents()
            grep.standardOutput.asText.get().readLines().each { marked << it }
            def untracked = spotlessProject.providers.exec {
                workingDir root
                commandLine 'git', 'ls-files', '--others', '--exclude-standard', '--', ':(glob)src/**/*.java'
                ignoreExitValue = true
            }
            if (untracked.result.get().exitValue != 0) return scanContents()
            untracked.standardOutput.asText.get().readLines().each { String path ->
                File file = new File(root, path)
                if (file.isFile() && file.getText('UTF-8').contains('//?')) marked << path
            }
            marked
        } catch (Exception ignored) {
            scanContents()
        }
    }
    // The ratchet already limits local checks to files changed since the default branch,
    // but the task still fingerprints every source file. Feed it the changed set directly
    // so the up-to-date check has almost nothing to hash. Any git failure falls back to the
    // complete tree, so a broken repository can never turn the check into a no-op.
    def ratchetTargets = spotlessRatchet ? spotlessProject.provider {
        try {
            // Compare against the merge base, not the moving default branch tip: a branch that
            // is behind master must not inherit master-only files into the local ratchet.
            def mergeBase = spotlessProject.providers.exec {
                workingDir spotlessProject.projectDir
                commandLine 'git', 'merge-base', spotlessRatchet, 'HEAD'
                ignoreExitValue = true
            }
            def base = mergeBase.result.get().exitValue == 0
                    ? mergeBase.standardOutput.asText.get().trim()
                    : spotlessRatchet
            def diff = spotlessProject.providers.exec {
                workingDir spotlessProject.projectDir
                commandLine 'git', '-c', 'core.quotepath=false', 'diff', '--name-only',
                        '--diff-filter=ACMR', '--relative', base, '--', ':(glob)src/**/*.java'
                ignoreExitValue = true
            }
            if (diff.result.get().exitValue == 0) {
                // The ratchet target is a plain file list, so the FileTree exclude and the
                // stonecutter targetExclude do not apply to it; filter them here instead.
                def excluded = stonecutterPaths.get()
                def paths = diff.standardOutput.asText.get().readLines()
                // git diff omits untracked files; a newly created source is still a local
                // edit and must be checked before it is staged.
                def untracked = spotlessProject.providers.exec {
                    workingDir spotlessProject.projectDir
                    commandLine 'git', '-c', 'core.quotepath=false', 'ls-files', '--others',
                            '--exclude-standard', '--', ':(glob)src/**/*.java'
                    ignoreExitValue = true
                }
                if (untracked.result.get().exitValue == 0) {
                    paths.addAll(untracked.standardOutput.asText.get().readLines())
                }
                return paths
                        .findAll { String path ->
                            path && !excluded.contains(path) && !path.contains('/generated/')
                        }
                        .collect { String path -> new File(spotlessProject.projectDir, path) }
                        .findAll { File file -> file.isFile() }
            }
        } catch (Exception ignored) {
            // Fall through to the complete tree.
        }
        javaSources.files as List
    } : null
    spotlessProject.spotless {
        java {
            target ratchetTargets != null ? spotlessProject.files(ratchetTargets) : javaSources
            targetExclude stonecutterPaths
            palantirJavaFormat('2.103.0')
        }
    }
    spotlessProject.tasks.matching { it.name == 'check' }.configureEach { dependsOn 'spotlessCheck' }
}

tasks.register('format') {
    group = 'build'
    description = 'Applies Spotless formatting to core, buildtools, shared Minecraft sources and both version nodes. ' +
            'Locally the ratchet limits this to files changed against origin/master; CI checks the full tree.'
    dependsOn spotlessProjects.collect { "${it}:spotlessApply" }
}

// Symmetric to 'format': one task that checks every module so a partial task list cannot
// skip a project's formatting. Locally ratchet-scoped to the branch's changed files.
tasks.register('checkFormat') {
    group = 'build'
    description = 'Checks Spotless formatting across core, buildtools, shared Minecraft sources and both version nodes. ' +
            'Run before pushing: locally the ratchet limits it to files changed against origin/master; ' +
            'CI additionally checks the full tree.'
    dependsOn spotlessProjects.collect { "${it}:spotlessCheck" }
}

apply from: 'gradle/stonecutter-native.gradle'

if (System.getProperty('idea.sync.active') == 'true') {
    gradle.projectsEvaluated {
        // Stonecutter 0.7.11 tags subproject directories as build roots in IDE sync requests.
        def buildRoot = rootProject.projectDir
        def taskRequests = gradle.startParameter.taskRequests.collect { request ->
            def requestRoot = request.rootDir
            if (request.projectPath && requestRoot && requestRoot != buildRoot
                    && requestRoot.toPath().startsWith(buildRoot.toPath())) {
                return new org.gradle.internal.DefaultTaskExecutionRequest(
                        request.args, request.projectPath, buildRoot)
            }
            request
        }
        gradle.startParameter.setTaskRequests(taskRequests)
    }
}

tasks.named('check').configure {
    dependsOn ':api:check', ':core:check', ':buildtools:test'
    dependsOn ':minecraft:1.20.1-forge:check', ':minecraft:1.21.1-neoforge:check'
    dependsOn spotlessProjects.collect { "${it}:spotlessCheck" }
}
tasks.named('assemble').configure { dependsOn 'assembleBothPlatforms' }
tasks.named('clean').configure {
    dependsOn ':api:clean', ':core:clean', ':minecraft:1.20.1-forge:clean', ':minecraft:1.21.1-neoforge:clean'
    dependsOn ':api-platform:1.20.1-forge:clean', ':api-platform:1.21.1-neoforge:clean'
}
