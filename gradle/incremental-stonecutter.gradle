import org.gradle.api.Action
import org.gradle.api.Task
import org.gradle.api.tasks.Sync
import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.Path
import java.nio.file.SimpleFileVisitor
import java.nio.file.StandardCopyOption
import java.nio.file.attribute.BasicFileAttributes

// Gradle decides when to run the Sync. When it runs, check actual bytes so a changed
// prepared source or a damaged output is repaired without rewriting the rest of the tree.
def syncStonecutter = { Sync task ->
    Path destination = task.destinationDir.toPath().toAbsolutePath().normalize()
    Map<Path, Path> files = new LinkedHashMap<>()
    Set<Path> directories = new LinkedHashSet<>()
    // The prepared sources follow the raw roots and win duplicate paths.
    task.source.visit { details ->
        Path target = destination.resolve(details.relativePath.pathString)
        if (details.directory) {
            if (task.includeEmptyDirs) directories.add(target)
        } else {
            files.put(target, details.file.toPath())
            Path parent = target.parent
            while (parent != destination && directories.add(parent)) {
                parent = parent.parent
            }
        }
    }

    // A build directory can itself be on a linked drive. Anchor the destination at its
    // resolved parent, but never traverse links (including Windows junctions) inside it.
    Files.createDirectories(destination.parent)
    Path expectedRoot = destination.parent.toRealPath().resolve(destination.fileName)
    if (Files.exists(destination, LinkOption.NOFOLLOW_LINKS)) {
        Files.walkFileTree(destination, new SimpleFileVisitor<Path>() {
            @Override
            FileVisitResult preVisitDirectory(Path dir, BasicFileAttributes attrs) {
                if (dir.toRealPath() != expectedRoot.resolve(destination.relativize(dir))) {
                    Files.delete(dir)
                    return FileVisitResult.SKIP_SUBTREE
                }
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult visitFile(Path file, BasicFileAttributes attrs) {
                if (!attrs.isRegularFile() || !files.containsKey(file)) Files.delete(file)
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult postVisitDirectory(Path dir, IOException failure) {
                if (failure != null) throw failure
                if (dir != destination && !directories.contains(dir)) Files.delete(dir)
                return FileVisitResult.CONTINUE
            }
        })
    }

    Files.createDirectories(destination)
    directories.each { Files.createDirectories(it) }
    int copied = 0
    files.each { Path target, Path source ->
        if (Files.isRegularFile(target, LinkOption.NOFOLLOW_LINKS)
                && Files.mismatch(source, target) == -1L) return
        Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.COPY_ATTRIBUTES)
        copied++
    }
    task.logger.lifecycle("Stonecutter sync ${task.name}: ${copied} copied, ${files.size()} total.")
}

tasks.withType(Sync).matching { it.name.startsWith('stonecutterGenerate') }.configureEach { Sync task ->
    task.setActions([new Action<Task>() {
        @Override
        void execute(Task ignored) {
            syncStonecutter(task)
        }
    }])
}
