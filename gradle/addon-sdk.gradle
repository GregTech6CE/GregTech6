// Compatibility entry points: SDKs are built by the in-repo :api-platform projects.
def platformApi = project(":api-platform:${project.name}")
def exports = [addonSdkJar: 'jar', addonSdkSourcesJar: 'sourcesJar', addonSdkJavadocJar: 'javadocJar']
exports.each { localName, producerName ->
    def producer = platformApi.tasks.named(producerName, Jar)
    tasks.register(localName, Copy) {
        description = "Export ${producerName} from the ${project.name} :api-platform project."
        group = 'build'
        from producer.flatMap { it.archiveFile }
        into layout.buildDirectory.dir('addon-sdk')
    }
}
tasks.register('addonSdkJavadoc') {
    group = 'documentation'
    dependsOn platformApi.tasks.named('javadoc')
}
tasks.register('generatePomFileForAddonApiPublication') {
    group = 'publishing'
    dependsOn platformApi.tasks.named('generatePomFileForAddonApiPublication')
}
tasks.register('addonSdk') {
    description = 'Build the common library and export the platform SDK with source and Javadoc attachments.'
    group = 'build'
    dependsOn 'addonSdkJar', 'addonSdkSourcesJar', 'addonSdkJavadocJar', ':api:assemble'
}
tasks.named('assemble').configure { dependsOn 'addonSdkJar', 'addonSdkSourcesJar', ':api:sourcesJar' }
