// Source-only Stonecutter nodes feed the existing native loader projects.
def node = project.path == ':' ? '1.20.1-forge' : '1.21.1-neoforge'
configurations {
    stonecutterEmiSources {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    stonecutterEmiSources project(path: ":multiversion:${node}", configuration: 'versionedSources')
}
// The directory artifact carries stonecutterGenerate as its build dependency.
sourceSets.main.java.srcDir(configurations.stonecutterEmiSources)

if (project.path == ':') {
    tasks.register('compileBothPlatforms') {
        group = 'build'
        description = 'Generate both Stonecutter EMI variants and compile both native platforms.'
        dependsOn ':compileJava', ':neoforge:compileJava'
    }
    tasks.register('assembleBothPlatforms') {
        group = 'build'
        description = 'Generate sources and assemble the Forge and NeoForge distribution jars.'
        dependsOn ':assemble', ':neoforge:assemble'
    }
    tasks.register('verifyStonecutterEmiSources', Exec) {
        group = 'verification'
        description = 'Compare generated EMI code with the exact pre-migration platform sources.'
        dependsOn ':multiversion:1.20.1-forge:stonecutterGenerate',
                ':multiversion:1.21.1-neoforge:stonecutterGenerate'
        workingDir rootProject.projectDir
        commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'), '-X', 'utf8',
                'tools/integration/check_stonecutter_emi.py'
    }
}
