import org.gradle.internal.DefaultTaskExecutionRequest

// Root entry points for the complete Stonecutter build.

// Stonecutter 0.7.11 uses a node's directory as the build root in IDEA sync requests.
// These nodes belong to this build; retain their task arguments and project paths.
if (Boolean.getBoolean('idea.sync.active')) {
    gradle.projectsEvaluated {
        gradle.startParameter.setTaskRequests(gradle.startParameter.taskRequests.collect { request ->
            def requestedProject = request.projectPath == null ? null : rootProject.findProject(request.projectPath)
            if (requestedProject != null && request.rootDir == requestedProject.projectDir
                    && request.rootDir != rootProject.rootDir
                    && request.args.every { it.tokenize(':').last().startsWith('stonecutter') }) {
                return new DefaultTaskExecutionRequest(
                        request.args, request.projectPath, rootProject.rootDir)
            }
            return request
        })
    }
}

tasks.register('compileBothPlatforms') {
    group = 'build'
    description = 'Generate all Stonecutter main sources and compile both native platforms.'
    dependsOn ':minecraft:1.20.1-forge:compileJava', ':minecraft:1.21.1-neoforge:compileJava'
}
tasks.register('assembleBothPlatforms') {
    group = 'build'
    description = 'Generate sources and assemble the Forge and NeoForge distribution jars.'
    dependsOn ':minecraft:1.20.1-forge:assemble', ':minecraft:1.21.1-neoforge:assemble'
}

// Backward-compatible root CLI entries delegate to the Forge node.
['compileJava', 'processResources', 'distributionJar', 'addonSdkJar',
 'runClient', 'runServer', 'runData', 'genIntellijRuns'].each { entry ->
    tasks.register(entry) { dependsOn ":minecraft:1.20.1-forge:${entry}" }
}
