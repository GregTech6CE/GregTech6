// platform-shared is one source tree compiled by both loaders. It is not a Gradle subproject
// and it is not core: Forge still reobfuscates its classes, and each loader keeps its own mixin refmap.
def sharedJava = rootProject.file('platform-shared/src/main/java')
def sharedResources = rootProject.file('platform-shared/src/main/resources')

sourceSets.main.java.srcDir sharedJava
sourceSets.main.resources {
    srcDir sharedResources
    // Placeholder files keep the empty directories in git. They are not mod resources.
    exclude '**/.gitkeep'
}

def findDuplicateResourcePaths = { File sharedDir, Collection<File> platformDirs ->
    if (!sharedDir.isDirectory()) {
        return []
    }
    def failures = []
    def present = platformDirs.findAll { it != null && it.isDirectory() && it.canonicalFile != sharedDir.canonicalFile }
    fileTree(dir: sharedDir, exclude: '**/.gitkeep').visit { details ->
        if (details.directory) {
            return
        }
        def relative = details.relativePath.pathString
        present.each { dir ->
            if (new File(dir, relative).isFile()) {
                failures << "${relative} is in ${sharedDir} and ${dir}"
            }
        }
    }
    failures
}

// The Forge incremental copy replaces Copy.copy() and does not apply DuplicatesStrategy.
// NeoForge's processResources defaults to including the first copy. Fail before either writes output.
tasks.named('processResources').configure {
    doFirst {
        def failures = findDuplicateResourcePaths(sharedResources, sourceSets.main.resources.srcDirs)
        if (!failures.isEmpty()) {
            throw new GradleException("Shared resources also exist in a platform directory:\n" + failures.join('\n'))
        }
    }
}

// Shared models store forge:composite. NeoForge rewrites that exact byte sequence after copying.
// The Forge incremental copy does not rewrite: its output has to stay byte-identical to the shared file.
def forgeCompositeLoader = '"loader": "forge:composite"'.getBytes('US-ASCII')
def neoCompositeLoader = '"loader": "neoforge:composite"'.getBytes('US-ASCII')

def replaceExactBytes = { byte[] input, byte[] from, byte[] to ->
    if (from.length == 0 || input.length < from.length) return input
    int extra = 0
    int count = 0
    int limit = input.length - from.length
    for (int i = 0; i <= limit; i++) {
        boolean same = true
        for (int j = 0; j < from.length; j++) {
            if (input[i + j] != from[j]) {
                same = false
                break
            }
        }
        if (!same) continue
        count++
        extra += to.length - from.length
        i += from.length - 1
    }
    if (count == 0) return input
    byte[] output = new byte[input.length + extra]
    int inPos = 0
    int outPos = 0
    limit = input.length - from.length
    for (int i = 0; i <= limit; i++) {
        boolean same = true
        for (int j = 0; j < from.length; j++) {
            if (input[i + j] != from[j]) {
                same = false
                break
            }
        }
        if (!same) continue
        int gap = i - inPos
        System.arraycopy(input, inPos, output, outPos, gap)
        outPos += gap
        System.arraycopy(to, 0, output, outPos, to.length)
        outPos += to.length
        inPos = i + from.length
        i += from.length - 1
    }
    System.arraycopy(input, inPos, output, outPos, input.length - inPos)
    return output
}

if (project.path == ':neoforge') {
    tasks.named('processResources').configure {
        inputs.property('gregtech.compositeLoader', 'neoforge:composite')
        doLast {
            def output = destinationDir
            fileTree(dir: output, include: '**/*.json').each { File file ->
                def original = file.bytes
                def replaced = replaceExactBytes(original, forgeCompositeLoader, neoCompositeLoader)
                if (!Arrays.equals(original, replaced)) file.bytes = replaced
            }
        }
    }
}

if (project == rootProject && project.hasProperty('compositeLoaderFixture')) {
    tasks.register('verifyCompositeLoaderRewrite') {
        doLast {
            def root = file(project.property('compositeLoaderFixture'))
            def source = new File(root, 'source.json').bytes
            def rewritten = replaceExactBytes(source, forgeCompositeLoader, neoCompositeLoader)
            new File(root, 'rewritten.json').bytes = rewritten
            def untouched = replaceExactBytes('{"parent":"block"}\r\n'.getBytes('US-ASCII'), forgeCompositeLoader, neoCompositeLoader)
            if (!Arrays.equals(untouched, '{"parent":"block"}\r\n'.getBytes('US-ASCII'))) {
                throw new GradleException('rewrite changed a file that has no composite loader')
            }
            if (rewritten.length != source.length + (neoCompositeLoader.length - forgeCompositeLoader.length)) {
                throw new GradleException('rewrite changed the file length by more than the loader id')
            }
        }
    }
}

if (project == rootProject && project.hasProperty('sharedDuplicateFixture')) {
    tasks.register('verifySharedResourceDuplicates') {
        doLast {
            def root = file(project.property('sharedDuplicateFixture'))
            def duplicated = findDuplicateResourcePaths(new File(root, 'duplicated/shared'), [new File(root, 'duplicated/platform')])
            def distinct = findDuplicateResourcePaths(new File(root, 'distinct/shared'), [new File(root, 'distinct/platform')])
            if (!duplicated.any { it.startsWith('assets/probe.txt ') }) {
                throw new GradleException('duplicate fixture was not reported: ' + duplicated)
            }
            if (!distinct.isEmpty()) {
                throw new GradleException('distinct fixture reported duplicates: ' + distinct)
            }
        }
    }
}
