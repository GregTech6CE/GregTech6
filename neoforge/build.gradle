plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = rootProject.property('mod_group_id')
version = rootProject.property('mod_version')

base {
    archivesName = "${rootProject.property('mod_id')}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    api {
        java {
            srcDir 'src/api/java'
            srcDir '../platform-shared/src/api/java'
        }
        compileClasspath += project(':core').sourceSets.api.output
    }
    bootstrapGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    productionSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    if (rootProject.findProperty('addonSample') == 'true') {
        addonSample {
            java { srcDir '../work/addon-sample/neoforge/java' }
            resources { srcDir '../work/addon-sample/neoforge/resources' }
        }
    }
}

repositories {
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:1.1.24+1.21.1:api"
    if (rootProject.findProperty('emiSmoke') == 'true') {
        runtimeOnly "dev.emi:emi-neoforge:1.1.24+1.21.1"
    }
    compileOnly "mezz.jei:jei-1.21.1-common-api:${rootProject.property('neoforge_jei_version')}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${rootProject.property('neoforge_jei_version')}"
    if (rootProject.findProperty('emiOnlySmoke') != 'true') {
        runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${rootProject.property('neoforge_jei_version')}"
    }
    compileOnly "maven.modrinth:jade:${rootProject.property('neoforge_jade_version')}"
    runtimeOnly "maven.modrinth:jade:${rootProject.property('neoforge_jade_version')}"
    if (rootProject.findProperty('compatRuntime') == 'ie') {
        runtimeOnly "maven.modrinth:immersiveengineering:${rootProject.property('neoforge_ie_version')}"
    }
    if (rootProject.findProperty('compatRuntime') == 'mek') {
        runtimeOnly "maven.modrinth:mekanism:${rootProject.property('neoforge_mek_version')}"
    }
    if (rootProject.findProperty('compatRuntime') == 'ae') {
        runtimeOnly "maven.modrinth:ae2:${rootProject.property('neoforge_ae_version')}"
        runtimeOnly "maven.modrinth:guideme:${rootProject.property('neoforge_guideme_version')}"
    }
    if (rootProject.findProperty('compatRuntime') == 'pr') {
        runtimeOnly "maven.modrinth:project-red-core:${rootProject.property('neoforge_pr_version')}"
        runtimeOnly "maven.modrinth:codechicken-lib:${rootProject.property('neoforge_ccl_version')}"
        runtimeOnly "maven.modrinth:cb-multipart:${rootProject.property('neoforge_cbm_version')}"
    }
    if (rootProject.findProperty('compatRuntime') == 'hc') {
        runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-core:${rootProject.property('neoforge_hc_version')}"
    }
    // Dev-only. KubeJS submits the same gregtech:machine JSON via event.custom(). Not in the production jar.
    if (rootProject.findProperty('kubejsRuntime') == 'true') {
        runtimeOnly "maven.modrinth:kubejs:2101.7.2-build.377"
        runtimeOnly "maven.modrinth:rhino:2101.2.8-build.91+Rhino-1.21"
        runtimeOnly "maven.modrinth:architectury-api:13.0.11+neoforge"
    }

    if (rootProject.findProperty('directCoreClasspath')?.toString() == 'true') {
        // Local development can use the same compiled core output directly.
        // This avoids rebuilding its large resource archive before an ordinary run.
        implementation files(project(':core').sourceSets.main.output, project(':core').sourceSets.api.output)
    } else {
        implementation project(':core')
    }
}

neoForge {
    version = '21.1.243'
    addModdingDependenciesTo sourceSets.bootstrapGameTest
    addModdingDependenciesTo sourceSets.productionSmoke

    runs {
        client {
            systemProperty 'gregtech.integration.clientCreateWorldSmoke', (rootProject.findProperty('clientCreateWorldSmoke') ?: 'false').toString()
            client()
            gameDirectory = project.file('run-client')
            systemProperty 'gregtech.integration.viewerFeedbackOnly', (rootProject.findProperty('viewerFeedbackOnly') ?: 'false').toString()
            systemProperty 'gregtech.integration.recipePresentationRuntimeOnly', (rootProject.findProperty('recipePresentationRuntimeOnly') ?: 'false').toString()
            systemProperty 'gregtech.integration.materialDataBrowserRuntimeOnly', (rootProject.findProperty('materialDataBrowserRuntimeOnly') ?: 'false').toString()
            systemProperty 'gregtech.integration.materialBushRuntimeOnly', (rootProject.findProperty('materialBushRuntimeOnly') ?: 'false').toString()
            systemProperty 'gregtech.integration.newIssuesRuntimeOnly', (rootProject.findProperty('newIssuesRuntimeOnly') ?: 'false').toString()
            systemProperty 'gregtech.integration.longDistanceRuntimeOnly', (rootProject.findProperty('longDistanceRuntimeOnly') ?: 'false').toString()
            systemProperty 'gregtech.integration.cokeRuntimeSmoke', (rootProject.findProperty('cokeRuntimeSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.clientSmoke', (rootProject.findProperty('clientSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.clientSmokeTimeoutSeconds', (rootProject.findProperty('clientSmokeTimeout') ?: '120').toString()
            systemProperty 'gregtech.integration.clientModelSmoke', (rootProject.findProperty('clientModelSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.clientWorldSmoke', (rootProject.findProperty('clientWorldSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.clientWorldPhase', (rootProject.findProperty('clientWorldPhase') ?: '').toString()
            systemProperty 'gregtech.integration.clientWorldName', (rootProject.findProperty('clientWorldName') ?: '').toString()
            systemProperty 'gregtech.integration.clientWorldId', (rootProject.findProperty('clientWorldId') ?: '').toString()
            if (rootProject.findProperty('clientSmoke') == 'true' || rootProject.findProperty('clientWorldSmoke') == 'true' || rootProject.findProperty('clientCreateWorldSmoke') == 'true') {
                sourceSet = sourceSets.bootstrapGameTest
                gameDirectory = project.file(rootProject.findProperty('clientWorldSmoke') == 'true'
                        ? 'build/client-world-smoke-run' : 'build/client-smoke-run')
                if (rootProject.findProperty('clientCreateWorldSmoke') == 'true') gameDirectory = project.file('build/world-creation-smoke-run')
                jvmArgument '-Xmx' + (rootProject.findProperty('clientSmokeHeap') ?: '2g').toString()
                programArguments.addAll('--width', '1280', '--height', '720')
            }
            systemProperty 'gregtech.integration.machineOverlayViewerSmoke', (rootProject.findProperty('machineOverlayViewerSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.machineOverlayViewerPhase', (rootProject.findProperty('machineOverlayViewerPhase') ?: 'create').toString()
            systemProperty 'gregtech.integration.machineOverlayVictim', (rootProject.findProperty('machineOverlayVictim') ?: '').toString()
            if (rootProject.findProperty('machineOverlayViewerSmoke') == 'true') {
                def overlayPhase = (rootProject.findProperty('machineOverlayViewerPhase') ?: 'create').toString()
                sourceSet = sourceSets.bootstrapGameTest
                gameDirectory = project.file(rootProject.findProperty('machineOverlayDirectory')
                        ?: (overlayPhase == 'join' ? 'build/machine-overlay-join-client' : 'build/machine-overlay-client'))
                jvmArguments.addAll('-Xmx6g', '-XX:+UseSerialGC')
                programArguments.addAll('--width', '1280', '--height', '720')
                if (overlayPhase == 'reopen') programArguments.addAll('--quickPlaySingleplayer', 'overlay-viewer')
                if (overlayPhase == 'join') programArguments.addAll('--quickPlayMultiplayer', 'localhost')
            }
        }
        server {
            systemProperty 'gregtech.integration.toolAssemblySmoke', (rootProject.findProperty('toolAssemblySmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.engineCraftingSmoke', (rootProject.findProperty('engineCraftingSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.electricFluxCraftingSmoke', (rootProject.findProperty('electricFluxCraftingSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.dieselCraftingSmoke', (rootProject.findProperty('dieselCraftingSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.dieselPowerSmoke', (rootProject.findProperty('dieselPowerSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.earlyToolChainSmoke', (rootProject.findProperty('earlyToolChainSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.dieselPowerBaseline', (rootProject.findProperty('dieselPowerBaseline') ?: 'false').toString()
            systemProperty 'gregtech.integration.dieselPowerReadOnly', (rootProject.findProperty('dieselPowerReadOnly') ?: 'false').toString()
            server()
            sourceSet = sourceSets.bootstrapGameTest
            systemProperty 'gregtech.integration.serverSmokePhase', (rootProject.findProperty('serverSmokePhase') ?: '').toString()
            systemProperty 'gregtech.integration.serverSmokeId', (rootProject.findProperty('serverSmokeId') ?: '').toString()
            systemProperty 'gregtech.integration.smelteryWorldSmoke', (rootProject.findProperty('smelteryWorldSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.machineWorldSmoke', (rootProject.findProperty('machineWorldSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.steamChainSmoke', (rootProject.findProperty('steamChainSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.manualToolSmoke', (rootProject.findProperty('manualToolSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.equipmentCraftingSmoke', (rootProject.findProperty('equipmentCraftingSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.poweredToolSmoke', (rootProject.findProperty('poweredToolSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.itemLogisticsSmoke', (rootProject.findProperty('itemLogisticsSmoke') ?: 'false').toString()
            systemProperty 'gregtech.integration.itemRoutingSmoke', (rootProject.findProperty('itemRoutingSmoke') ?: 'false').toString()
            ['X', 'Y', 'Z'].each { axis ->
                def coordinate = rootProject.findProperty('serverSmoke' + axis)
                if (coordinate != null) systemProperty 'gregtech.integration.serverSmoke' + axis, coordinate.toString()
            }
            gameDirectory = project.file('run-server')
            if (rootProject.findProperty('serverDirectory')) {
                gameDirectory = project.file(rootProject.property('serverDirectory'))
            }
            jvmArgument '-Xmx2g'
            if (rootProject.findProperty('addonSampleHalt') == 'true') jvmArgument '-DaddonSampleHalt=true'
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.bootstrapGameTest
            gameDirectory = project.file(rootProject.findProperty('neoforgeGameTestDirectory') ?: 'build/bootstrap-gametest-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', (rootProject.findProperty('gameTestNamespaces') ?: 'gregtech_bootstrap').toString()
            jvmArgument '-Xmx' + (rootProject.findProperty('gameTestHeap') ?: '1536m').toString()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            if (rootProject.findProperty('materialScale')) jvmArgument "-Dgregtech.materialScale=${rootProject.findProperty('materialScale')}"
        }
    }

    mods {
        "${rootProject.property('mod_id')}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
            sourceSet project(':core').sourceSets.main
            sourceSet project(':core').sourceSets.api
            sourceSet sourceSets.bootstrapGameTest
        }
        if (rootProject.findProperty('addonSample') == 'true') {
            addon_sample {
                sourceSet sourceSets.addonSample
            }
        }
    }
}

def modProperties = [
        mod_id: rootProject.property('mod_id'),
        mod_name: rootProject.property('mod_name'),
        mod_version: project.version.toString(),
        mod_license: rootProject.property('mod_license'),
        mod_description: rootProject.property('mod_description'),
        mod_authors: 'saltnya, brokestar233, Lorbineitte Masson, GregTech 6 team'
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(modProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// NeoForge-only builds must enforce the same shared contracts/source policy.
tasks.named('check').configure { dependsOn ':core:check' }

tasks.named('jar', Jar).configure {
    // Embedding the complete shared resource catalog requires ZIP64 too.
    zip64 = true
    // The same Java 17 output used by Forge is embedded exactly once.
    from project(':core').sourceSets.main.output
    from project(':core').sourceSets.api.output
    from sourceSets.api.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('Implementation-Version': project.version.toString())
}

// Separate test mod for launching the actual distribution in an isolated instance.
tasks.register("productionSmokeJar", Jar) {
    dependsOn tasks.named("productionSmokeClasses")
    archiveBaseName = "gregtech-delivery-probe"
    destinationDirectory = layout.buildDirectory.dir("production-probe")
    from(sourceSets.productionSmoke.output) {
        include "com/gregtech/gregtech/integration/client/ProductionClientSmoke*.class"
        include "com/gregtech/gregtech/integration/client/*DeliveryChecks*.class"
    }
    from(rootProject.file("tools/integration/production-probe/neoforge"))
}

apply from: rootProject.file('gradle/platform-shared.gradle')

def addonExternalCompile = configurations.compileClasspath.filter { file ->
    def path = file.absolutePath.replace('\\', '/')
    def core = project(':core').projectDir.absolutePath.replace('\\', '/')
    !path.startsWith(core + '/')
}
sourceSets.api.compileClasspath += addonExternalCompile
// Project dependencies expose core's main classes, not classes that only the core jar copies in.
def addonApiOutputs = files(sourceSets.api.output, project(':core').sourceSets.api.output)
sourceSets.main.compileClasspath += addonApiOutputs
sourceSets.main.runtimeClasspath += addonApiOutputs
['bootstrapGameTest', 'productionSmoke', 'test'].each { name ->
    sourceSets.named(name) {
        compileClasspath += addonApiOutputs
        runtimeClasspath += addonApiOutputs
    }
}

def addonSdkJar = tasks.register('addonSdkJar', Jar) {
    description = 'Compile-only NeoForge addon SDK: core API plus this loader API, Mojang names.'
    group = 'build'
    dependsOn tasks.named('compileApiJava'), project(':core').tasks.named('compileApiJava')
    archiveBaseName = 'gregtech6-addon-sdk-1.21.1-neoforge'
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('addon-sdk')
    from project(':core').sourceSets.api.output
    from sourceSets.api.output
    from(project(':core').file('src/main/resources/META-INF/gregtech6')) { into 'META-INF/gregtech6' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def addonSampleClasspath = files(addonSdkJar.flatMap { it.archiveFile }) + configurations.compileClasspath.filter { file ->
    def path = file.absolutePath.replace('\\', '/')
    def core = project(':core').projectDir.absolutePath.replace('\\', '/')
    def build = layout.buildDirectory.get().asFile.absolutePath.replace('\\', '/')
    // Compiled GregTech classes stay out. NeoForge keeps its loader artifacts under build/moddev.
    def loaderArtifact = path.startsWith(build + '/moddev/') || path.startsWith(build + '/addon-sdk/')
    !path.startsWith(core + '/') && (!path.startsWith(build + '/') || loaderArtifact)
}
def compileAddonSample = tasks.register('compileAddonSample', JavaCompile) {
    description = 'Compiles the NeoForge sample addon against the SDK jar and the loader, without GregTech internals.'
    group = 'verification'
    dependsOn addonSdkJar
    source = fileTree(rootProject.file('work/addon-sample/neoforge/java'))
    classpath = addonSampleClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/addon-sample')
    options.encoding = 'UTF-8'
    options.release = 21
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}
if (rootProject.findProperty('addonSample') == 'true') {
    sourceSets.addonSample.compileClasspath = addonSampleClasspath
    sourceSets.addonSample.runtimeClasspath = sourceSets.main.runtimeClasspath + sourceSets.addonSample.output
}

def addonApiClosureCheck = tasks.register('addonApiClosureCheck', Exec) {
    description = 'Fails when the NeoForge API or the sample addon references a GregTech internal class.'
    group = 'verification'
    dependsOn tasks.named('compileApiJava'), compileAddonSample
    workingDir rootProject.projectDir
    def python = rootProject.findProperty('pythonExecutable') ?: 'python'
    def platformApi = layout.buildDirectory.dir('classes/java/api').get().asFile.absolutePath
    def coreApi = project(':core').layout.buildDirectory.dir('classes/java/api').get().asFile.absolutePath
    def sample = layout.buildDirectory.dir('classes/addon-sample').get().asFile.absolutePath
    def sdk = addonSdkJar.flatMap { it.archiveFile }.get().asFile.absolutePath
    commandLine python, '-X', 'utf8', 'tools/integration/check_addon_api_closure.py',
            '--check', platformApi, '--allow', platformApi, '--allow', coreApi,
            '--kind', 'neoforge', '--sample', sample, '--sdk', sdk
}
tasks.named('check').configure { dependsOn addonApiClosureCheck }
