name: ai-analysis

# A（issue 仓库）只负责：installation check、占位评论、dispatch。
# 最终写入由 B 侧独立的 finalize job 完成；A 不再轮询、不下载 artifact、不渲染。

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: issue 编号
        required: true
        type: string
      dry_run:
        description: 为 true 时只跑 gate/analysis、不发评论
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: gt6ce-trigger-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    if: |
      (vars.BOT_ENABLED != 'false') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && github.event.issue.user.type != 'Bot') ||
       (github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, vars.GT6CE_BOT_MENTION || '@gt6ce-bot') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone execution repo
        run: |
          set -euo pipefail
          git init -q .bot
          git -C .bot remote add origin https://github.com/GregTech6CE/ai-gateway.git
          git -C .bot fetch -q --depth 1 origin branch
          git -C .bot checkout -q FETCH_HEAD

      - name: App token (issues:write on this repository)
        id: app_rw
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: App token (actions:write on ai-gateway)
        id: app_dispatch
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
          owner: GregTech6CE
          repositories: ai-gateway
          permission-actions: write

      - name: Start control
        id: start
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'issues' || github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REQUEST_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_NAME: ${{ vars.GT6CE_BOT_NAME || 'gt6ce-bot' }}
          B_REPO: GregTech6CE/ai-gateway
          GH_RW_TOKEN: ${{ steps.app_rw.outputs.token }}
          B_PAT: ${{ steps.app_dispatch.outputs.token }}
        run: python .bot/scripts/control.py start
