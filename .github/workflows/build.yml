name: Dual-platform build

on:
  push:
    branches: [main]
    paths-ignore: ['README*']
  pull_request:
    branches: [main]
    paths-ignore: ['README*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check shared code, language and resources once
        run: |
          ./gradlew --no-daemon --stacktrace :verifyStonecutterSources :core:check
          python -X utf8 tools/integration/generate_remi_material_groups.py --check
          python -X utf8 -m unittest tools.tests.test_release_artifacts tools.tests.test_release_publish
      - name: Preserve failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-check-diagnostics
          path: |
            build/reports/
            core/build/reports/
            core/build/test-results/

  build:
    name: Build ${{ matrix.minecraft }} ${{ matrix.loader }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            loader: forge
          - minecraft: '1.21.1'
            loader: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Build and verify platform package
        env:
          NODE: ${{ matrix.minecraft }}-${{ matrix.loader }}
          LOADER: ${{ matrix.loader }}
        run: |
          ./gradlew --no-daemon --stacktrace prepareNativeTools :core:addonApiJar \
            ":multiversion:$NODE:build" -x :core:check
          python -X utf8 tools/ci/artifacts.py package "$LOADER"
      - uses: actions/upload-artifact@v4
        with:
          name: gt6ce-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: work/ci-artifacts/
          if-no-files-found: error
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.loader }}
          path: |
            build/reports/
            core/build/reports/
            multiversion/versions/*/build/reports/
            multiversion/versions/*/build/test-results/

  required-builds:
    name: Both platform builds required
    needs: [checks, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform builds and shared checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gt6ce-*
          path: work/artifacts/
      - name: Verify matching builds and prepare release files
        run: python -X utf8 tools/ci/artifacts.py collect work/artifacts work/release
      - uses: actions/upload-artifact@v4
        with:
          name: gt6ce-release
          path: work/release/
          if-no-files-found: error

  release:
    name: Update development release
    needs: required-builds
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gt6ce-release
          path: work/release/
      - name: Publish both jars to nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tools/ci/publish_release.py work/release
