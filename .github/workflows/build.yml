name: Dual-platform build

on:
  push:
    branches: [main]
    paths-ignore: ['README*']
  pull_request:
    branches: [main]
    paths-ignore: ['README*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.minecraft }} ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            loader: forge
            node: '1.20.1-forge'
          - minecraft: '1.21.1'
            loader: neoforge
            node: '1.21.1-neoforge'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Build platform
        run: ./gradlew --no-daemon --stacktrace ":minecraft:${{ matrix.node }}:build"
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gt6ce-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            minecraft/versions/${{ matrix.node }}/build/libs/*.jar
            minecraft/versions/${{ matrix.node }}/build/addon-sdk/*.jar
          if-no-files-found: error
