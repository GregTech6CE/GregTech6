name: Focused issue regressions

on:
  push:
    branches: ['main', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: issue-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue-gameplay:
    name: ${{ matrix.loader }} issue gameplay regressions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: forge
            node: 1.20.1-forge
          - loader: neoforge
            node: 1.21.1-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JDK 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install JDK 17 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check asset and CI evidence regressions
        run: python -X utf8 -m unittest tools.tests.test_issue76_sapling_assets tools.tests.test_issue_ci_evidence tools.tests.test_casing_sensor_ci_evidence tools.tests.test_upstream_extra_admission tools.tests.test_sensor_progress_ci_evidence tools.tests.test_cinnabar_barrel_ci_evidence tools.tests.test_ore_form_output_ci_evidence tools.tests.test_selector_cover_admission tools.tests.test_instrument_translations tools.tests.test_recipe_translations tools.tests.test_restart_phase_evidence tools.tests.test_stone_layer_slab_fixture tools.tests.test_burning_box_fuel_ci_evidence
      - name: Check original sediment worldgen registration
        run: python -X utf8 tools/integration/check_sediment_worldgen_registration.py
      - name: Run isolated development GameTests
        # Official development GameTestServer exemption only. Never write eula=true;
        # this does not accept a production dedicated-server EULA.
        run: |
          chmod +x gradlew
          mkdir -p work
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.java.home="$JAVA17_HOME" \
            -Dorg.gradle.java.installations.fromEnv=JAVA17_HOME,JAVA21_HOME \
            -Dorg.gradle.java.installations.auto-download=false \
            -PaddonSample=true \
            -PgameTestNamespaces=gregtech_issue_audit,gregtech_cover_issues,gregtech_pipe_auto,gt6ce_api_contracts,gt6ce_crystal_barrel,gt6ce_diesel_repair,gt6ce_legacy_energy,gt6ce_machine_performance,gregtech_ore_source_audit,gregtech_ore_thermal_audit,gt6ce_barracks_door,gt6ce_structure_tracking,gt6ce_structure_incremental,gregtech_sensor_source,gregtech_tuning,gregtech_machine_casing,gregtech_sensor_interfaces,gregtech_sensor_progress,gregtech_barrel_resume,gregtech_ore_form_outputs,gt6ce_burning_box_fuels \
            -PgameTestHeap=3g \
            -PgameTestDirectory=build/issues-64-81-gametest \
            -PneoforgeGameTestDirectory=build/issues-64-81-gametest \
            -PgameTestReport=build/reports/gametest/issues-64-81.xml \
            :multiversion:${{ matrix.node }}:runGameTestServer \
            2>&1 | tee work/issues-gametest.log
      - name: Require every selected regression to execute and pass
        if: always()
        run: >-
          python -X utf8 tools/integration/check_issue_gametest_report.py
          multiversion/versions/${{ matrix.node }}/build/reports/gametest/issues-64-81.xml
          --platform ${{ matrix.loader }}
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}-issue-regressions-${{ github.sha }}
          if-no-files-found: warn
          path: |
            work/issues-gametest.log
            multiversion/versions/${{ matrix.node }}/build/reports/gametest/issues-64-81.xml
            multiversion/versions/${{ matrix.node }}/build/issues-64-81-gametest/logs/
