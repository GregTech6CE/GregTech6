plugins {
    id 'java-library'
}

dependencies {
    api project(':api')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Use the same checked resource synchronization as both loader projects. Later local
// builds only copy changed shared assets instead of replacing the entire catalog.
apply from: rootProject.file('gradle/incremental-resources.gradle')
tasks.named('processResources').configure { filteringCharset = 'UTF-8' }

// Optional development launch path: these shared resources are static and need no expansion.
// Keep normal CI/release behavior; local launches can avoid copying the entire asset catalog.
if (rootProject.findProperty('directCoreResources')?.toString() == 'true') {
    sourceSets.main.output.resourcesDir = file('src/main/resources')
    tasks.named('processResources').configure { enabled = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    // Shared textures/models now exceed the ZIP 16-bit entry count.
    zip64 = true
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Pure core contracts do not need the shared Minecraft texture/model catalog.
sourceSets.test {
    compileClasspath = sourceSets.main.output.classesDirs + configurations.testCompileClasspath
    runtimeClasspath = output + sourceSets.main.output.classesDirs + configurations.testRuntimeClasspath
}

def centrifugeContracts = tasks.register('centrifugeContracts', JavaExec) {
    description = 'Runs the focused, dependency-free Centrifuge core regressions.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gregtech.content.recipe.generated.CentrifugeContracts'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('check').configure { dependsOn centrifugeContracts }

['configContracts': 'gregtech.util.ConfigContracts',
 'coverContracts': 'gregtech.content.cover.CoverGeometryContracts',
 'potionBottlingContracts': 'gregtech.content.fluid.PotionBottlingContracts',
 'moldChiselContracts': 'gregtech.content.recipe.MoldChiselContracts',
 'pipeGeometryContracts': 'gregtech.engine.machine.PipeGeometryContracts',
 'sensorContracts': 'gregtech.engine.sensor.SensorContracts'].each { taskName, entryPoint ->
    def contracts = tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entryPoint
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    }
    tasks.named('check').configure { dependsOn contracts }
}
