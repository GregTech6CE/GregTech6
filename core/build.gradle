plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    api {
        java.srcDir 'src/api/java'
    }
}

dependencies {
    implementation sourceSets.api.output
}

// Use the same checked resource synchronization as both loader projects. Later local
// builds only copy changed shared assets instead of replacing the entire catalog.
apply from: rootProject.file('gradle/incremental-resources.gradle')
tasks.named('processResources').configure { filteringCharset = 'UTF-8' }

// The root task also runs for NeoForge-only builds via :core:check.
tasks.named('check').configure { dependsOn ':sourcePolicyCheck' }

// Optional development launch path: these shared resources are static and need no expansion.
// Keep normal CI/release behavior; local launches can avoid copying the entire asset catalog.
if (rootProject.findProperty('directCoreResources')?.toString() == 'true') {
    sourceSets.main.output.resourcesDir = file('src/main/resources')
    tasks.named('processResources').configure { enabled = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Pure Java contracts do not consume the shared Minecraft asset catalog.
// Keep tens of thousands of static resources off their compiler/runtime classpaths.
sourceSets.test {
    compileClasspath = sourceSets.api.output + sourceSets.main.output.classesDirs + configurations.testCompileClasspath
    runtimeClasspath = sourceSets.api.output + output + sourceSets.main.output.classesDirs + configurations.testRuntimeClasspath
}

tasks.named('jar', Jar).configure {
    // Shared textures/models now exceed the ZIP 16-bit entry count.
    zip64 = true
    from sourceSets.api.output
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The pure Java SDK remains available separately from each loader's native SDK.
// Neither SDK includes implementation output or the shared asset catalog.
tasks.register('addonApiJar', Jar) {
    dependsOn tasks.named('compileApiJava')
    archiveBaseName = "${rootProject.property('mod_id')}-addon-api"
    archiveVersion = rootProject.version.toString()
    from sourceSets.api.output.classesDirs
    from('src/main/resources/META-INF/gregtech6') { into 'META-INF/gregtech6' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def addonApiClosureCheck = tasks.register('addonApiClosureCheck', Exec) {
    description = 'Fails when a core API class references anything outside the API and the JDK.'
    group = 'verification'
    dependsOn tasks.named('compileApiJava')
    workingDir rootProject.projectDir
    def python = rootProject.findProperty('pythonExecutable') ?: 'python'
    def classes = layout.buildDirectory.dir('classes/java/api')
    commandLine python, '-X', 'utf8', 'tools/integration/check_addon_api_closure.py',
            '--check', classes.get().asFile.absolutePath,
            '--allow', classes.get().asFile.absolutePath,
            '--kind', 'core'
    inputs.files(sourceSets.api.allJava).withPropertyName('coreAddonApiSources')
            .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    inputs.dir(classes).withPropertyName('coreAddonApiClasses')
            .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
}
tasks.named('check').configure { dependsOn addonApiClosureCheck }

// These deterministic contracts consume only compiled core/test classes and test
// resources. JavaExec tracks its classpath, arguments and toolchain as inputs.
// A success marker lets unchanged local builds reuse a pass without launching
// four more JVMs. A changed input, missing marker or --rerun-tasks executes again.
[
    coreBehaviorContracts: 'CoreBehaviorContracts',
    materialBehaviorContracts: 'MaterialBehaviorContracts',
    thermalBehaviorContracts: 'ThermalBehaviorContracts',
    machineSpecBehaviorContracts: 'MachineSpecBehaviorContracts'
].each { taskName, entryPoint ->
    def contract = tasks.register(taskName, JavaExec) {
        description = "Runs ${entryPoint} without Minecraft; reuses unchanged successful inputs."
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.gregtech.gregtech.core.${entryPoint}"
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        def marker = layout.buildDirectory.file("reports/contracts/${taskName}.passed")
        outputs.file(marker)
        doFirst { marker.get().asFile.delete() }
        doLast {
            marker.get().asFile.parentFile.mkdirs()
            marker.get().asFile.setText("${entryPoint}: passed\n", 'UTF-8')
        }
    }
    tasks.named('check').configure { dependsOn contract }
}

